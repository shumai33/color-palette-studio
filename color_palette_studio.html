<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f0e8">
<title>Color Palette Studio</title>
<style>
:root{color-scheme:light;--bg:#f5f1eb;--card:#fffdfa;--ink:#51483f;--muted:#9b8d7e;--line:#e9e0d5;--accent:#88735f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
main{width:min(720px,100%);margin:auto;padding:28px 18px 60px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted)}h1{font-size:25px;margin:4px 0;font-weight:650;letter-spacing:-.04em}.mark{background:#eee5da;border-radius:14px;padding:13px;font-size:22px}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #66533b08}h2{font-size:15px;margin:0 0 14px}.muted{font-size:12px;color:var(--muted);line-height:1.6}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}button,input,select{font:inherit}button{cursor:pointer}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#fffdfa;color:var(--ink);font-size:13px}.primary{background:var(--accent);border-color:var(--accent);color:white}.full{width:100%}input[type=color]{width:48px;height:42px;border:0;background:none;padding:0;cursor:pointer}.hex{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;color:var(--ink);font-family:monospace;font-size:15px}.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}.swatch{height:76px;width:100%;border:0;border-radius:10px}.swatch-label{text-align:center;font-size:10px;color:var(--muted);font-family:monospace;margin-top:6px;cursor:pointer}.upload{display:block;border:1.5px dashed #c9b8a5;border-radius:14px;background:#faf7f2;padding:23px;text-align:center;cursor:pointer}.upload strong{display:block;font-size:14px;margin:5px}.hidden{display:none!important}canvas{display:block;max-width:100%;max-height:480px;width:auto;height:auto;margin:auto;border-radius:10px;cursor:crosshair}.canvas-wrap{background:#f4eee6;padding:10px;border-radius:12px;margin-top:12px;text-align:center}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fffdfa;color:var(--ink)}#gradient{height:110px;border-radius:12px;margin:12px 0}.fav{background:#f7f3ed;border-radius:12px;padding:12px;margin-top:9px}.favbar{display:flex;height:30px;overflow:hidden;border-radius:7px;margin-top:9px}.favbar button{flex:1;border:0}.status{text-align:center;font-size:12px;color:var(--muted);min-height:20px;margin:12px}
@media(max-width:420px){main{padding:20px 13px 40px}section{padding:15px}.swatch{height:60px}.btn{padding:9px 10px}}
</style>
</head>
<body>
<main>
<header class="head"><div><div class="eyebrow">COLOR DESIGN TOOL</div><h1>Color Palette Studio</h1><div class="muted">Your colors, your inspiration.</div></div><div class="mark">✳</div></header>
<section>
<h2>01 / Image Extractor</h2>
<label class="upload" for="file"><div style="font-size:25px">＋</div><strong>画像を選択する</strong><span class="muted">PNG · JPG · WEBP</span></label>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden">
<div id="imageArea" class="hidden"><div class="row" style="justify-content:space-between;margin:12px 0 5px"><span class="muted">画像をタップして色を取得</span><button id="clear" class="btn">画像を解除</button></div><div class="canvas-wrap"><canvas id="canvas"></canvas></div><p id="pickMsg" class="muted">画像の好きな場所をクリックしてね。</p></div>
<div class="split" style="margin-top:12px"><button id="extract" class="btn primary" disabled>✦ 代表色を5色抽出</button><button id="pick" class="btn" disabled>⌖ スポイトで取得</button></div>
</section>
<section>
<h2>02 / My Colors</h2><div class="row"><input type="color" id="base" value="#CDBBA7"><div class="grow"><div class="eyebrow">BASE COLOR</div><input id="hex" class="hex" value="#CDBBA7" maxlength="7"></div><button id="copyBase" class="btn">コピー</button></div>
<div id="swatches" class="swatches"></div><div class="split"><button id="generate" class="btn primary">配色を生成</button><button id="copyAll" class="btn">5色まとめてコピー</button></div>
<p class="muted">色をタップするとベースカラーに設定。HEXコードをタップするとコピーできるよ。</p>
</section>
<section>
<h2>03 / Gradient Studio</h2><div id="gradient"></div><div class="split"><div class="field"><label>TYPE</label><select id="type"><option value="linear">Linear</option><option value="radial">Radial</option></select></div><div class="field"><label>ANGLE</label><select id="angle"><option value="90">90°</option><option value="0">0°</option><option value="45">45°</option><option value="135">135°</option><option value="180">180°</option></select></div></div><button id="copyCss" class="btn full" style="margin-top:12px">CSSをコピー</button>
</section>
<section>
<div class="row" style="justify-content:space-between"><h2 style="margin:0">04 / Favorites</h2><span id="count" class="muted">0 SAVED</span></div><button id="save" class="btn primary full" style="margin-top:14px">♡ このパレットを保存</button><div id="favs"></div><p class="muted">お気に入りはこのブラウザに保存され、次回も使えるよ。</p>
</section>
<div id="status" class="status" role="status" aria-live="polite">COLOR PALETTE STUDIO</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);let palette=['#E7D8C7','#D9C9B8','#CDBBA7','#B3A08B','#8F7D6A'],imageURL=null;
let favorites=[];try{favorites=JSON.parse(localStorage.getItem('cps-favorites-v2')||'[]');if(!Array.isArray(favorites))favorites=[]}catch(e){}
const say=t=>$('status').textContent=t;
const norm=h=>/^#[0-9a-f]{6}$/i.test(h)?h.toUpperCase():null;
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hex=(r,g,b)=>'#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('').toUpperCase();
function hsl(h,s,l){s/=100;l/=100;let a=s*Math.min(l,1-l),f=n=>{let k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)))};return hex(f(0)*255,f(8)*255,f(4)*255)}
function toHSL(h){let [r,g,b]=rgb(h).map(v=>v/255),max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,H=0,S=0,L=(max+min)/2;if(d){S=d/(1-Math.abs(2*L-1));if(max===r)H=60*((g-b)/d%6);else if(max===g)H=60*((b-r)/d+2);else H=60*((r-g)/d+4)}return[(H+360)%360,S*100,L*100]}
function make(h){let[H,S,L]=toHSL(h);return[hsl(H,Math.min(90,S*.65+8),Math.min(94,L+29)),hsl(H,Math.min(95,S*.8+5),Math.min(88,L+14)),h,hsl((H+27)%360,Math.max(12,S*.75),Math.max(12,L-12)),hsl((H+180)%360,Math.max(12,S*.65),Math.max(15,L-23))]}
function setBase(h){$('base').value=h;$('hex').value=h;palette=make(h);render()}
function render(){let area=$('swatches');area.innerHTML='';palette.forEach(c=>{let wrap=document.createElement('div'),b=document.createElement('button'),label=document.createElement('div');b.className='swatch';b.style.background=c;b.title='ベースカラーに設定';b.addEventListener('click',()=>{setBase(c);say(c+' をベースカラーに設定')});label.className='swatch-label';label.textContent=c;label.addEventListener('click',()=>copy(c));wrap.append(b,label);area.append(wrap)});updateGradient()}
function copy(s){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>say(s+' をコピーしました')).catch(()=>fallback(s));else fallback(s)}
function fallback(s){let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();try{document.execCommand('copy');say('コピーしました: '+s)}catch(e){say('コピーできませんでした')}t.remove()}
function updateGradient(){let stops=palette[0]+','+palette[2]+','+palette[4],css=$('type').value==='linear'?`linear-gradient(${$('angle').value}deg,${stops})`:`radial-gradient(circle,${stops})`;$('gradient').style.background=css;$('gradient').dataset.css=css}
$('base').addEventListener('input',e=>setBase(e.target.value.toUpperCase()));
$('hex').addEventListener('change',e=>{let h=norm(e.target.value);if(h)setBase(h);else e.target.value=$('base').value});
$('copyBase').onclick=()=>$('base').value&&copy($('base').value);
$('generate').onclick=()=>{palette=make($('base').value);render();say('新しい配色を生成しました')};
$('copyAll').onclick=()=>copy(palette.join('\n'));
$('type').onchange=updateGradient;$('angle').onchange=updateGradient;
$('copyCss').onclick=()=>copy('background: '+$('gradient').dataset.css+';');
function saveFavs(){try{localStorage.setItem('cps-favorites-v2',JSON.stringify(favorites))}catch(e){say('保存容量を確認してください')}renderFavs()}
function renderFavs(){$('count').textContent=favorites.length+' SAVED';let area=$('favs');area.innerHTML='';favorites.forEach((f,i)=>{let card=document.createElement('div');card.className='fav';let row=document.createElement('div');row.className='row';let name=document.createElement('span');name.className='grow muted';name.textContent=f.base;let load=document.createElement('button');load.className='btn';load.textContent='読込';load.onclick=()=>{setBase(f.base);palette=[...f.colors];render();say('お気に入りを読み込みました')};let del=document.createElement('button');del.className='btn';del.textContent='削除';del.onclick=()=>{favorites.splice(i,1);saveFavs()};row.append(name,load,del);let bar=document.createElement('div');bar.className='favbar';f.colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>copy(c);bar.append(b)});card.append(row,bar);area.append(card)})}
$('save').onclick=()=>{favorites.unshift({base:$('base').value,colors:[...palette]});saveFavs();say('お気に入りに保存しました')};
function showImage(img){let c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),scale=Math.min(1,900/img.width,650/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);ctx.drawImage(img,0,0,c.width,c.height);$('imageArea').classList.remove('hidden');$('extract').disabled=false;$('pick').disabled=false;say('画像を読み込みました')}
$('file').onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){say('PNG・JPG・WEBPを選んでね');return}if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(f);let img=new Image();img.onload=()=>showImage(img);img.onerror=()=>say('画像を読み込めませんでした');img.src=imageURL};
$('clear').onclick=()=>{$('imageArea').classList.add('hidden');$('file').value='';$('extract').disabled=true;$('pick').disabled=true;if(imageURL)URL.revokeObjectURL(imageURL);imageURL=null;say('画像を解除しました')};
function sample(x,y){let d=$('canvas').getContext('2d',{willReadFrequently:true}).getImageData(x,y,1,1).data,h=hex(d[0],d[1],d[2]);setBase(h);$('pickMsg').textContent='取得した色: '+h;say('スポイトで '+h+' を取得しました')}
$('canvas').onclick=e=>{let c=$('canvas'),r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*c.width/r.width),y=Math.floor((e.clientY-r.top)*c.height/r.height);sample(Math.max(0,Math.min(c.width-1,x)),Math.max(0,Math.min(c.height-1,y)))};
$('pick').onclick=()=>say('画像の好きな場所をクリックしてね');
$('extract').onclick=()=>{let c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,d=ctx.getImageData(0,0,w,h).data,bins=new Map();for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){let i=(y*w+x)*4;if(d[i+3]<100)continue;let r=d[i],g=d[i+1],b=d[i+2],key=[r>>3,g>>3,b>>3].join(','),v=bins.get(key);if(v){v[0]++;v[1]+=r;v[2]+=g;v[3]+=b}else bins.set(key,[1,r,g,b])}let sorted=[...bins.values()].sort((a,b)=>b[0]-a[0]),picked=[];for(let v of sorted){let color=hex(v[1]/v[0],v[2]/v[0],v[3]/v[0]);if(picked.every(p=>{let a=rgb(p),b=rgb(color);return Math.sqrt(a.reduce((s,z,i)=>s+(z-b[i])**2,0))>48})){picked.push(color);if(picked.length===5)break}}if(!picked.length){say('画像から色を取得できませんでした');return}while(picked.length<5)picked.push(picked[picked.length-1]);palette=picked;setBase(picked[2]);palette=picked;render();say('画像から代表色5色を抽出しました！')};
render();renderFavs();
})();
</script>
</body></html>
